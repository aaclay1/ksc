for(let i=0;i<5;i++){let group=new THREE.Group();let part=scoopBase.clone();part.rotation.x=Math.PI/2;part.rotation.z=-Math.PI/2;group.add(part);scene.add(group);scoops.push(group)}
function beltPoint(f){const straight=len,arc=Math.PI*radius,total=2*straight+2*arc;let d=((f%1)+1)%1*total;let p,normal,theta;
if(d<straight){p=low.clone().addScaledVector(dir,d/len);normal=tangent.clone()}
else if((d-=straight)<arc){theta=d/radius;p=high.clone().addScaledVector(tangent,radius*Math.cos(theta)).addScaledVector(dir,radius/len*Math.sin(theta));normal=p.clone().sub(high).normalize()}
else if((d-=arc)<straight){p=high.clone().addScaledVector(dir,-d/len);normal=tangent.clone().negate()}
else{d-=straight;theta=d/radius;p=low.clone().addScaledVector(tangent,-radius*Math.cos(theta)).addScaledVector(dir,-radius/len*Math.sin(theta));normal=p.clone().sub(low).normalize()}
return {p,normal}}
const ballGeometry=stl(B,green);ballGeometry.scale.set(1,1,1);ballGeometry.rotation.x=-Math.PI/2;scene.add(ballGeometry);
// shooter at upper right, ball passes between two wheels on opposite sides of the ball, axis across depth
const shootX=182,shootY=350;box(130,12,150,169,307,0,steel);box(10,75,10,114,342,-76,steel);box(10,75,10,114,342,76,steel);
const wheels=[];for(let z of [-42,42]){let w=cyl(36,17,shootX,shootY,z,rubber,'z');let hub=cyl(11,19,shootX,shootY,z,cyan,'z');wheels.push([w,hub])}
box(115,5,45,160,324,0,cyan);const exit=new THREE.ArrowHelper(new THREE.Vector3(1,.28,0).normalize(),new THREE.Vector3(216,350,0),100,0x80e6ff,15,8);scene.add(exit);
// intake approach ball
const intake=stl(B,green);intake.scale.set(1,1,1);intake.rotation.x=-Math.PI/2;scene.add(intake);
const shot=stl(B,green);shot.scale.set(1,1,1);shot.rotation.x=-Math.PI/2;scene.add(shot);
const clock=new THREE.Clock();let time=0,playing=true;document.getElementById('toggle').onclick=()=>{playing=!playing;document.getElementById('toggle').textContent=playing?'Pause':'Play'};
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);if(playing)time+=dt;let t=time%12;
for(let i=0;i<scoops.length;i++){let {p,normal}=beltPoint(t/13+i/scoops.length);scoops[i].position.copy(p).addScaledVector(normal,29);scoops[i].rotation.z=Math.atan2(normal.y,normal.x)-Math.PI/2}
// intake ball moves from floor to first scoop
intake.visible=t<2.1;intake.position.set(-225+Math.min(t/2.1,1)*80,32,0);
// active ball rides with conveyor; scoop remains visible
ballGeometry.visible=t>=2.1&&t<8;let u=Math.min(Math.max((t-2.1)/5.9,0),1);ballGeometry.position.copy(low.clone().lerp(high,u)).addScaledVector(tangent,65);
shot.visible=t>=8&&t<10.6;let q=(t-8)/2.6;shot.position.set(shootX+q*380,shootY+q*120-100*q*q,0);
for(let [w,h] of wheels){w.rotation.y+=playing?dt*15:0;h.rotation.y+=playing?dt*15:0}
let phase=t<2.1?'1 • Ground pickup':t<8?'2 • Scoop lifts ball up conveyor':t<10.6?'3 • Dual flywheels launch ball':'4 • Resetting for next ball';const phaseElement=document.getElementById('phase');if(phaseElement)phaseElement.textContent=phase;
controls.update();renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
